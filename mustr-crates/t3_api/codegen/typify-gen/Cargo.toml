[package]
name = "t3-typify-gen"
license = "GPL-3.0-or-later"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
typify = { version = "=0.8.0", default-features = false }
schemars = "0.8.22"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
anyhow = "1"
quote = "1"
proc-macro2 = "1"
prettyplease = "0.3"
heck = "0.5"
syn = { version = "3", default-features = false, features = ["full", "parsing", "printing", "visit-mut"] }

[workspace]
