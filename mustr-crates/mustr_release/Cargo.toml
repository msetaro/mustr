[package]
name = "mustr_release"
version = "0.1.0"
edition.workspace = true
publish = false
license = "GPL-3.0-or-later"
description = "mustr's update manifest and its Ed25519 signature: the format the updater reads, and the release tool that writes and signs it"

[lints]
workspace = true

[lib]
path = "src/mustr_release.rs"
doctest = false

[[bin]]
name = "mustr-release"
path = "src/main.rs"

# No Zed crates: the release workflow builds this tool on its own.
[dependencies]
anyhow.workspace = true
base64.workspace = true
hex.workspace = true
# Ed25519 and SHA-256. Already in mustr's dependency tree (through rustls); not a workspace
# dependency, so it's pinned here (`mustr-docs/SYNC.md`).
ring = "0.17"
semver.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true

[dev-dependencies]
pretty_assertions.workspace = true
tempfile.workspace = true
