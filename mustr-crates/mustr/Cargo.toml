[package]
name = "mustr"
version = "0.1.1"
edition.workspace = true
publish = false
license = "GPL-3.0-or-later"
description = "mustr, a review-first desktop app built on Zed and backed by a T3 Code server"

[lints]
workspace = true

[[bin]]
name = "mustr"
path = "src/main.rs"

[features]
default = ["runtime_shaders"]
# Compiles GPUI's Metal shaders when mustr starts instead of when it's built, so building on macOS
# needs only Apple's Command Line Tools, not Xcode's Metal toolchain (`mustr-docs/MACOS.md`).
# Zed's Nix build does the same (nix/build.nix). It changes nothing on other platforms.
runtime_shaders = ["gpui_platform/runtime_shaders"]

[dependencies]
anyhow.workspace = true
askpass.workspace = true
assets.workspace = true
chrono = { workspace = true, features = ["clock"] }
clap.workspace = true
client.workspace = true
collections.workspace = true
command_palette.workspace = true
command_palette_hooks.workspace = true
db.workspace = true
diagnostics.workspace = true
dirs.workspace = true
editor.workspace = true
feature_flags.workspace = true
file_finder.workspace = true
fs.workspace = true
futures.workspace = true
git.workspace = true
git_hosting_providers.workspace = true
git_ui.workspace = true
go_to_line.workspace = true
gpui = { workspace = true, features = ["stacker"] }
gpui_platform = { workspace = true, features = ["font-kit", "wayland", "x11"] }
gpui_tokio.workspace = true
http_client.workspace = true
iana-time-zone = "0.1"
inspector_ui.workspace = true
language.workspace = true
languages = { workspace = true, features = ["load-grammars"] }
log.workspace = true
lsp_locations.workspace = true
menu.workspace = true
migrator.workspace = true
mustr_languages = { path = "../mustr_languages" }
mustr_release = { path = "../mustr_release" }
mustr_ui = { path = "../mustr_ui" }
node_runtime.workspace = true
parking_lot.workspace = true
paths.workspace = true
picker.workspace = true
platform_title_bar.workspace = true
plist.workspace = true
project.workspace = true
rayon.workspace = true
release_channel.workspace = true
reqwest_client.workspace = true
review = { path = "../review" }
search.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
session.workspace = true
settings.workspace = true
shellexpand.workspace = true
strum.workspace = true
t3_client = { path = "../t3_client" }
t3_runtime = { path = "../t3_runtime" }
terminal.workspace = true
terminal_view.workspace = true
theme.workspace = true
theme_selector.workspace = true
theme_settings.workspace = true
thread_chat = { path = "../thread_chat" }
time.workspace = true
ui.workspace = true
ui_prompt.workspace = true
url.workspace = true
util.workspace = true
uuid.workspace = true
vim.workspace = true
vim_mode_setting.workspace = true
watch.workspace = true
which_key.workspace = true
workspace.workspace = true
zed_actions.workspace = true
zlog.workspace = true
zlog_settings.workspace = true

[target.'cfg(unix)'.dependencies]
# Refusing to run as root (`main.rs`).
nix = { workspace = true, features = ["user"] }

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
image.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true
# The Dock badge and notification sounds (`src/notifications.rs`).
objc2-app-kit = { workspace = true, features = ["NSDockTile", "NSSound"] }
objc2-foundation.workspace = true

[dev-dependencies]
editor = { workspace = true, features = ["test-support"] }
gpui = { workspace = true, features = ["test-support"] }
http_client = { workspace = true, features = ["test-support"] }
language = { workspace = true, features = ["test-support"] }
project = { workspace = true, features = ["test-support"] }
# `project`'s test support turns on `remote`'s mock transport, which `remote_connection`
# handles only with its own.
remote_connection = { workspace = true, features = ["test-support"] }
settings = { workspace = true, features = ["test-support"] }
pretty_assertions.workspace = true
tempfile.workspace = true
workspace = { workspace = true, features = ["test-support"] }
