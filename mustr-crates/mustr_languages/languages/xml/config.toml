name = "XML"
grammar = "xml"
path_suffixes = [
  "xml",
  "config",
  "nuspec",
  "plist",
  "resx",
  "ruleset",
  "runsettings",
  "svg",
  "xaml",
  "xsd",
  "xslt",
]
first_line_pattern = '^<.*xml'
block_comment = ["<!-- ", " -->"]
brackets = [{ start = "<", end = ">", close = true, newline = true }]
prettier_parser_name = "xml"
