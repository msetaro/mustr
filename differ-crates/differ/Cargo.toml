[package]
name = "differ"
version = "0.1.0"
edition.workspace = true
publish = false
license = "GPL-3.0-or-later"
description = "Differ, a review-first desktop app built on Zed and backed by a T3 Code server"

[lints]
workspace = true

[[bin]]
name = "differ"
path = "src/main.rs"

